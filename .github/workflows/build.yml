      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: app
        run: |
          flutter create --platforms=android --org com.pocketssh --project-name pocketssh .
          rm -rf test
          python3 tool/patch_android.py

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Используется постоянный ключ подписи"
          else
            echo "::warning::Секрет KEYSTORE_B64 не задан — обновление поверх старой версии не встанет"
          fi

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/PocketSSH-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PocketSSH-${{ github.run_number }}
          path: out/*.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pocket SSH build ${{ github.run_number }}
          files: out/*.apk
          make_latest: true
