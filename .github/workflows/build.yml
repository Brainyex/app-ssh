      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows project
        working-directory: app
        shell: bash
        run: |
          flutter create --platforms=windows --org com.pocketssh --project-name pocketssh .
          rm -rf test
          python tool/patch_windows.py
          python -m pip install -q pillow
          python tool/make_icons.py windows

      - name: Build
        working-directory: app
        shell: pwsh
        run: |
          flutter pub get
          flutter build windows --release
          New-Item -ItemType Directory -Force -Path ../out | Out-Null
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ../out/PocketSSH-windows-${{ github.run_number }}.zip

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows
          path: out/*.zip

  # Релиз публикуется, даже если одна из платформ не собралась.
  release:
    needs: [android, windows]
    if: always() && (needs.android.result == 'success' || needs.windows.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Pocket SSH build ${{ github.run_number }}
          body: "Android: ${{ needs.android.result }}, Windows: ${{ needs.windows.result }}"
          files: out/*
          make_latest: true
