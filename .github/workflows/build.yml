      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      # NDK заранее и с повторами: скачивание с серверов Google иногда обрывается.
      - name: Install Android NDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          NDK="28.2.13676358"
          for i in 1 2 3; do
            rm -rf "$SDK/ndk/$NDK"
            yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK" > /dev/null && break
            echo "Попытка $i не удалась, повтор..."
            sleep 15
          done
          ls "$SDK/ndk/$NDK/source.properties"

      - name: Generate Android project
        working-directory: app
        run: |
          flutter create --platforms=android --org com.pocketssh --project-name pocketssh .
          rm -rf test
          python3 tool/patch_android.py
          python3 -m venv /tmp/iv && /tmp/iv/bin/pip install -q pillow
          /tmp/iv/bin/python tool/make_icons.py android

      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          mkdir -p ~/.android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Используется постоянный ключ подписи"
          else
            echo "::warning::Секрет KEYSTORE_B64 не задан — обновление поверх старой версии не встанет"
          fi

      - name: Build
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release --target-platform android-arm64
          mkdir -p ../out
          cp build/app/outputs/flutter-apk/app-release.apk ../out/PocketSSH-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android
          path: out/*.apk

